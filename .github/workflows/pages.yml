name: Pages demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qscn-tool/frontend/package-lock.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install and test
        run: npm ci && npm test
        working-directory: qscn-tool/frontend
      - name: Validate snapshot and build demo
        run: |
          python3 ../scripts/check_demo_snapshot.py
          npm run build:demo
          test -f dist/demo/demo-snapshot.json
          ! find dist -type f \( -name '*.zip' -o -name '*.hmm' -o -name '*.sqlite*' -o -name '*.faa' -o -name '*.fna' \) | grep .
        working-directory: qscn-tool/frontend
      - name: Verify demo in Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run preview -- --mode demo &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/Q-SCOPE/ >/dev/null && break
            sleep 1
          done
          QSCN_E2E_URL=http://127.0.0.1:4173 npx playwright test e2e/demo.spec.ts
        working-directory: qscn-tool/frontend
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: qscn-tool/frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
